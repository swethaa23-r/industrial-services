<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | Stackly</title>
    <meta name="description" content="Page not found.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap">

    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Theme CSS -->
    <link href="https://html.awaikenthemes.com/axiron/css/bootstrap.min.css" rel="stylesheet" media="screen">
    <link href="https://html.awaikenthemes.com/axiron/css/animate.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .error-page-wrapper {
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background-color: var(--c-offwhite, #F5F7F9);
            text-align: center;
            padding: 20px;
        }
        
        .error-code {
            font-size: clamp(70px, 20vw, 180px);
            font-weight: 800;
            color: var(--c-navy, #0B1F33);
            line-height: 1;
            margin-bottom: 20px;
            letter-spacing: -5px;
        }
        
        .error-code span {
            color: var(--c-orange, #F28C28);
            display: inline-block;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-30px);}
            60% {transform: translateY(-15px);}
        }
        
        .error-title {
            font-size: clamp(24px, 4vw, 36px);
            color: var(--c-navy, #0B1F33);
            margin-bottom: 15px;
            font-weight: 700;
        }
        
        .error-desc {
            color: var(--t-gray, #5B6670);
            margin-bottom: 40px;
            max-width: 500px;
            font-size: 16px;
        }
        
        .error-btns {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn-back {
            display: inline-flex;
            align-items: center;
            padding: 14px 32px;
            border: 2px solid var(--c-navy, #0B1F33);
            color: var(--c-navy, #0B1F33);
            font-weight: 600;
            border-radius: 4px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .btn-back:hover {
            background-color: var(--c-navy, #0B1F33);
            color: white;
        }
        
        .btn-home {
            display: inline-flex;
            align-items: center;
            padding: 14px 32px;
            background-color: var(--c-orange, #F28C28);
            color: white;
            font-weight: 600;
            border-radius: 4px;
            text-decoration: none;
            border: 2px solid var(--c-orange, #F28C28);
            transition: all 0.3s ease;
        }
        
        .btn-home:hover {
            background-color: var(--c-navy, #0B1F33);
            border-color: var(--c-navy, #0B1F33);
            color: white;
        }
        
        .brand-logo-404 {
            max-width: 220px;
            margin-bottom: 50px;
        }

        @media (max-width: 576px) {
            .error-btns {
                flex-direction: column;
                gap: 15px;
            }
            .btn-back, .btn-home {
                width: 100%;
                justify-content: center;
                min-height: 48px; /* Accessible touch target */
            }
        }
    </style>
</head>
<body>
    <div class="error-page-wrapper">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8 text-center animate__animated animate__fadeInUp">
                    
                    <a href="index.html">
                        <img src="assets/stackly logo orange.webp" alt="Stackly" class="brand-logo-404">
                    </a>
                    
                    <div class="error-code">4<span>0</span>4</div>
                    <h2 class="error-title">Oops! Page Not Found</h2>
                    <p class="error-desc mx-auto">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
                    
                    <div class="error-btns">
                        <!-- Go Back Button -->
                        <a href="javascript:history.back()" class="btn-back">
                            <i class="fa-solid fa-arrow-left" style="margin-right: 8px;"></i> Go Back
                        </a>
                        
                        <!-- Go To Home Button -->
                        <a href="index.html" class="btn-home">
                            Go to Home <i class="fa-solid fa-arrow-right" style="margin-left: 8px;"></i>
                        </a>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
</body>
</html>
